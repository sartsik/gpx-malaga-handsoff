<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EBB763">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hands Off">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" type="image/png">
<title>Hands Off</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
  :root{
    --panel:#F7F1E3;
    --ink:#17151A;
    --alarm:#E0342C;
    --sun:#FFD23F;
  }
  *{box-sizing:border-box}
  html{color-scheme:light}
  html,body{height:100%}
  body{
    margin:0;background:#EBB763;color:var(--ink);
    font-family:"VT323",monospace;font-size:19px;line-height:1.35;
    -webkit-tap-highlight-color:transparent;overflow:hidden;
  }
  .px{font-family:"Press Start 2P","VT323",monospace}

  /* ---------- full-screen stage ---------- */
  .stage{position:fixed;inset:0;overflow:hidden;background:#EBB763}
  .stage canvas{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;image-rendering:pixelated;
    user-select:none;-webkit-user-select:none;
  }
  .stage[data-mode="alarm"] canvas{animation:shake .16s steps(2,end) infinite}
  @keyframes shake{
    0%{transform:translate(0,0)}
    25%{transform:translate(-5px,3px)}
    50%{transform:translate(4px,-3px)}
    75%{transform:translate(-4px,-3px)}
    100%{transform:translate(5px,3px)}
  }
  .flashov{position:absolute;inset:0;background:rgba(224,52,44,.30);opacity:0;pointer-events:none}
  .stage[data-mode="alarm"] .flashov{animation:fl .5s steps(2,end) infinite}
  @keyframes fl{0%,49%{opacity:0}50%,100%{opacity:1}}

  /* ---------- HUD ---------- */
  .hud{
    position:absolute;top:calc(5% + env(safe-area-inset-top));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    pointer-events:none;text-align:center;
  }
  .hud-word{
    font-family:"Press Start 2P",monospace;font-size:14px;color:#FDFDF6;
    text-shadow:2px 0 0 var(--ink),-2px 0 0 var(--ink),0 2px 0 var(--ink),0 -2px 0 var(--ink),
      2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);
  }
  .hud-word[data-tone="armed"]{color:var(--sun)}
  .hud-word[data-tone="alarm"]{color:#FF6A5E}
  .hud-time{
    font-family:"Press Start 2P",monospace;font-size:40px;color:#FDFDF6;
    font-variant-numeric:tabular-nums;letter-spacing:.03em;
    text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),
      3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);
  }
  .hud-time[data-tone="alarm"]{color:#FF6A5E}

  /* ---------- scream bubbles ---------- */
  .bubble{
    position:absolute;display:none;z-index:3;
    background:#FDFDF6;border:3px solid var(--ink);
    box-shadow:4px 4px 0 rgba(23,21,26,.35);
    padding:9px 11px;
    font-family:"Press Start 2P",monospace;font-size:11px;color:var(--alarm);
    white-space:nowrap;
  }
  .bubble::after{
    content:"";position:absolute;bottom:-8px;width:12px;height:12px;
    background:#FDFDF6;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);
    transform:rotate(45deg);
  }
  .bubble.b1{left:6%;top:24%}
  .bubble.b1::after{left:60%}
  .bubble.b2{left:50%;top:44%}
  .bubble.b2::after{left:25%}
  .bubble.b3{left:8%;top:66%}
  .bubble.b3::after{left:70%}
  .bubble.b4{left:56%;top:77%}
  .bubble.b4::after{left:30%}
  .stage[data-mode="alarm"] .bubble{display:block;animation:jig .22s steps(2,end) infinite}
  .bubble.b2{animation-delay:.11s}
  .bubble.b3{animation-delay:.06s}
  .bubble.b4{animation-delay:.17s}
  @keyframes jig{0%{transform:translate(0,0)}50%{transform:translate(-2px,2px)}100%{transform:translate(2px,-1px)}}

  /* ---------- the one button ---------- */
  .main-btn{
    position:absolute;left:14px;right:14px;
    bottom:calc(14px + env(safe-area-inset-bottom));z-index:4;
    border:3px solid var(--ink);box-shadow:5px 5px 0 rgba(23,21,26,.4);cursor:pointer;
    background:var(--alarm);color:#FFF3EA;
    font-family:"Press Start 2P",monospace;font-size:14px;
    padding:21px 12px;text-transform:uppercase;overflow:hidden;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  .main-btn[data-state="active"]{background:var(--panel);color:var(--ink)}
  .main-btn:active{transform:translate(2px,2px);box-shadow:3px 3px 0 rgba(23,21,26,.4)}
  .main-btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
  .main-btn .hold-fill{
    position:absolute;inset:0;right:auto;width:calc(var(--p,0)*100%);
    background:repeating-linear-gradient(45deg,var(--alarm) 0 8px,#F2A69B 8px 16px);
  }
  .main-btn span{position:relative}

  /* ---------- warnings ---------- */
  .warn{
    position:absolute;left:14px;right:14px;z-index:5;
    border:2px solid var(--ink);background:var(--sun);box-shadow:4px 4px 0 rgba(23,21,26,.35);
    color:var(--ink);padding:10px 14px;font-size:18px;
  }
  #noSensor{top:calc(14px + env(safe-area-inset-top))}
  #permWarn{bottom:calc(104px + env(safe-area-inset-bottom))}
  .ghost-btn{
    background:var(--panel);border:2px solid var(--ink);box-shadow:3px 3px 0 rgba(23,21,26,.28);
    color:var(--ink);font-family:"VT323",monospace;font-size:19px;
    padding:9px;width:100%;cursor:pointer;
  }
  .ghost-btn:active{transform:translate(2px,2px);box-shadow:none}

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001s!important;transition-duration:.001s!important}
    .stage[data-mode="alarm"] canvas{animation:none}
    .stage[data-mode="alarm"] .flashov{animation:none;opacity:1}
    .stage[data-mode="alarm"] .bubble{animation:none}
  }
  [hidden]{display:none!important}
</style>
</head>
<body>


<div class="stage" id="scene" data-mode="idle">
  <canvas id="sceneCv" width="128" height="232" role="img"
    aria-label="Pixel art animation: two people sunbathing on the beach, sipping cocktails"></canvas>
  <div class="flashov"></div>

  <div class="hud">
    <span class="hud-word px" id="hudWord" data-tone="idle">HANDS OFF</span>
    <span class="hud-time px" id="hudTime" data-tone="idle">--</span>
  </div>

  <div class="bubble b1" aria-hidden="true">AAAAH!!</div>
  <div class="bubble b2" aria-hidden="true">Do nothing!!!</div>
  <div class="bubble b3" aria-hidden="true">Drop the phone!</div>
  <div class="bubble b4" aria-hidden="true">Aaagghh</div>

  <div class="warn" id="noSensor" hidden>
    No motion sensors found on this device. Open this page in your
    <b>phone's browser</b> — that's where the beach works.
  </div>
  <div class="warn" id="permWarn" hidden>
    <span id="permMsg"></span>
    <a class="ghost-btn" id="fsLink" target="_blank" rel="noopener" hidden
       style="display:block;text-align:center;text-decoration:none;margin-top:10px">↗ open in a full browser tab</a>
    <div id="copyRow" hidden style="margin-top:10px;display:flex;gap:8px">
      <input id="copyUrl" readonly
        style="flex:1;min-width:0;font-family:'VT323',monospace;font-size:16px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);padding:6px 8px">
      <button class="ghost-btn" id="copyBtn" style="width:auto;padding:6px 12px">copy</button>
    </div>
  </div>

  <button class="main-btn" id="mainBtn" data-state="idle">
    <span class="hold-fill"></span>
    <span id="mainLabel">☼ Arm the villa</span>
  </button>
</div>

<script>
(() => {
  "use strict";

  // ---------- state ----------
  const THRESHOLD = 1.4;          // m/s² composite; picking the phone up crosses this easily
  const TRIP_END = new Date(2026, 9, 10).getTime();   // Saturday 10 October 2026, midnight local
  let mode = "idle";              // idle | arming | armed | alarm
  let armingLeft = 0, armedAt = 0, armedWall = 0;

  // motion
  let motionLevel = 0, lastAccel = null, gotMotion = false, lastMotionTs = 0, stillSince = 0;

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- els ----------
  const $ = id => document.getElementById(id);
  const els = {
    scene: $("scene"), hudWord: $("hudWord"), hudTime: $("hudTime"),
    mainBtn: $("mainBtn"), mainLabel: $("mainLabel"),
    noSensor: $("noSensor"), permWarn: $("permWarn"),
  };
  if (!("DeviceMotionEvent" in window)) els.noSensor.hidden = false;

  // ---------- pixel beach, drawn from scratch every frame ----------
  const g2 = $("sceneCv").getContext("2d");
  const W = 128, H = 232;
  const PAL = {
    sky:"#7FD4F2", sun:"#FFD23F", sunEdge:"#F2A33C", cloud:"#FDFDF6",
    seaDeep:"#1F8ECD", sea:"#35A8DC", seaLite:"#6CC6E8", shallows:"#A8E4EC",
    foam:"#FDFDF6", wetSand:"#D8A85C",
    sand:"#EBB763", sandDk:"#D69C4A", sandLt:"#F7D08C",
    ink:"#17151A", white:"#FDFDF6", mouth:"#7A1F1F",
    umbRed:"#E0463C", umbYel:"#FFD23F", umbTeal:"#2FA89E", umbBlue:"#3E6FD0", pole:"#8A5A33",
  };
  const DUDES = [
    { x:40, y:118, ty:110, th:56, skin:"#C98850", skinDk:"#A96B38", hair:"#5A3A22",
      suit:"#2E4A78", tw:"#3E6FD0", st:"#B8D0F2", gl:"warm", off:0,   long:false },
    { x:88, y:138, ty:130, th:56, skin:"#E8B36B", skinDk:"#C68F4C", hair:"#F5DE9C",
      suit:"#8E4AB8", tw:"#E86F8E", st:"#F7C6D2", gl:"cool", off:2.3, long:true },
  ];
  const SPECKS = [];
  for (let i = 0; i < 130; i++) SPECKS.push([(i*37+11)%W, 70+((i*53+7)%(H-76)), i%3]);

  function p(x, y, w, h, c) { g2.fillStyle = c; g2.fillRect(x|0, y|0, w, h); }
  function disc(x0, y0, r, c) {
    for (let dy = -r; dy <= r; dy++) {
      const w = Math.floor(Math.sqrt(r*r - dy*dy));
      p(x0-w, y0+dy, 2*w+1, 1, c);
    }
  }
  function cloudPx(x, y) { p(x, y+2, 14, 3, PAL.cloud); p(x+3, y, 8, 2, PAL.cloud); }
  function glass(x, y, kind) {
    const A = kind === "warm"
      ? ["#FFD23F","#FF9436","#E0342C","#59C98B","#E0342C"]
      : ["#59C98B","#1FA7A0","#2E86C1","#FF9436","#8E5AC8"];
    p(x+4, y-3, 1, 3, A[4]);
    p(x+3, y-4, 2, 1, A[4]);
    p(x, y, 7, 1, PAL.white);
    p(x+1, y+1, 5, 1, A[0]);
    p(x+1, y+2, 5, 1, A[1]);
    p(x+2, y+3, 3, 1, A[2]);
    p(x+3, y+4, 1, 2, PAL.ink);
    p(x+1, y+6, 5, 1, PAL.ink);
    p(x-1, y-1, 2, 2, A[3]);
  }
  function towel(d) {
    const x0 = d.x - 15;
    p(x0, d.ty, 30, d.th, d.tw);
    for (let yy = d.ty+4; yy < d.ty+d.th-3; yy += 8) {
      p(x0, yy, 30, 3, d.st);
      p(x0, yy+3, 30, 1, PAL.white);
    }
    for (let xx = x0+1; xx < x0+30; xx += 3) {
      p(xx, d.ty-2, 1, 2, d.tw); p(xx, d.ty+d.th, 1, 2, d.tw);
    }
  }
  function umbrella(x0, y0) {
    p(x0, y0, 2, 42, PAL.pole);
    p(x0-1, y0+40, 4, 2, "#6E4626");
    const cols = [PAL.umbRed, PAL.umbYel, PAL.umbTeal, PAL.umbBlue];
    for (let dy = -16; dy <= 0; dy++) {
      const w = Math.floor(Math.sqrt(16*16 - dy*dy));
      for (let dx = -w; dx <= w; dx++) {
        const seg = Math.min(3, Math.floor(Math.atan2(-dy, dx) / Math.PI * 4));
        g2.fillStyle = cols[seg];
        g2.fillRect(x0+dx+1, y0+dy, 1, 1);
      }
    }
    for (let dx = -16; dx <= 14; dx += 4) p(x0+dx+1, y0+1, 3, 1, "rgba(23,21,26,.25)");
    p(x0, y0-19, 2, 3, PAL.pole);
  }
  function person(d, t) {
    towel(d);
    const hx = d.x, hy = d.y, shY = hy+5, isF = d.long;
    const scream = mode === "alarm";
    const ph = ((t + d.off) % 4.6) / 4.6;
    const sipping = !scream && ph > 0.60 && ph < 0.86;
    const lifting = !scream && ((ph > 0.50 && ph <= 0.60) || (ph >= 0.86 && ph < 0.96));

    if (isF) {
      p(hx-6, hy-5, 12, 4, d.hair);
      p(hx+4, hy-4, 5, 30, d.hair);
      p(hx+5, hy+24, 4, 8, d.hair);
    }
    p(hx-10, hy-4, 3, 6, d.skin);
    p(hx-8, hy+1, 4, 4, d.skin);
    if (!scream && !sipping && !lifting) {
      p(hx+7, hy-4, 3, 6, d.skin);
      p(hx+4, hy+1, 4, 4, d.skin);
    }
    disc(hx, hy, 4, d.skin);
    if (!isF) { p(hx-4, hy-4, 9, 2, d.hair); p(hx-5, hy-3, 3, 2, d.hair); p(hx+3, hy-3, 2, 2, d.hair); }
    else { p(hx-4, hy-4, 9, 2, d.hair); p(hx-5, hy-3, 2, 3, d.hair); }
    if (scream) {
      p(hx-2, hy-1, 1, 1, PAL.ink); p(hx+2, hy-1, 1, 1, PAL.ink);
      p(hx-1, hy+1, 3, 3, PAL.mouth);
    } else {
      p(hx-3, hy, 2, 1, PAL.ink); p(hx+2, hy, 2, 1, PAL.ink);
      if (sipping) p(hx, hy+2, 2, 2, PAL.mouth);
      else p(hx-1, hy+2, 2, 1, PAL.ink);
    }
    const sw = isF ? 5 : 6;
    p(hx-sw, shY, sw*2, 3, d.skin);
    if (isF) {
      p(hx-4, shY+3, 8, 12, d.skin);
      p(hx-4, shY+3, 8, 3, d.suit);
      p(hx-4, shY+15, 8, 6, d.suit);
    } else {
      p(hx-5, shY+3, 10, 12, d.skin);
      p(hx-5, shY+15, 10, 8, d.suit);
    }
    const legY = shY + (isF ? 21 : 23);
    p(hx-4, legY, 3, 16, d.skin); p(hx+1, legY, 3, 16, d.skin);
    p(hx-4, legY+16, 3, 2, d.skinDk); p(hx+1, legY+16, 3, 2, d.skinDk);

    if (scream) {
      const j = reduceMotion ? 0 : Math.round(Math.sin(t*30 + d.off));
      p(hx+6, hy-7+j, 3, 8, d.skin); p(hx+6, hy-9+j, 3, 2, d.skinDk);
      p(hx-9, hy-8-j, 3, 8, d.skin); p(hx-9, hy-10-j, 3, 2, d.skinDk);
      p(hx+11, legY-4, 7, 2, d.gl === "warm" ? "#FF9436" : "#1FA7A0");
      p(hx+12, legY-8, 1, 4, PAL.white);
      p(hx+13, legY-7, 3, 2, d.gl === "warm" ? "#FFD23F" : "#59C98B");
      p(hx+16, legY-8, 1, 4, PAL.ink);
    } else if (sipping) {
      p(hx+6, shY-1, 3, 4, d.skin);
      p(hx+4, hy+3, 5, 3, d.skin);
      glass(hx+2, hy+3, d.gl);
    } else if (lifting) {
      p(hx+6, shY, 3, 6, d.skin);
      glass(hx+5, shY+1, d.gl);
    } else {
      glass(hx+12, shY+8, d.gl);
    }
  }
  function bigScreamFace(x0, y0, baseR, d, t) {
    let jx = 0, jy = 0, r = baseR;
    if (!reduceMotion) {
      const jt = Math.floor(t*12) + (d.long ? 7 : 0);
      jx = (jt*73 % 5) - 2;
      jy = (jt*31 % 3) - 1;
      r = baseR + ((Math.floor(t*6) + (d.long ? 1 : 0)) % 2 ? 2 : 0);
    }
    const x = x0 + jx, y = y0 + jy;
    disc(x, y, r+1, PAL.ink);
    disc(x, y, r, d.skin);
    if (d.long) {
      for (let dy = -r; dy <= -Math.floor(r*0.5); dy++) {
        const w = Math.floor(Math.sqrt(r*r - dy*dy));
        p(x-w, y+dy, 2*w+1, 1, d.hair);
      }
      p(x-r-2, y-Math.floor(r*0.5), 5, Math.floor(r*1.5), d.hair);
      p(x+r-3, y-Math.floor(r*0.5), 5, Math.floor(r*1.5), d.hair);
    } else {
      for (let dy = -r; dy <= -Math.floor(r*0.55); dy++) {
        const w = Math.floor(Math.sqrt(r*r - dy*dy));
        p(x-w, y+dy, 2*w+1, 1, d.hair);
      }
      for (let k = -2; k <= 2; k++) p(x+k*5-1, y-Math.floor(r*0.55), 2, 3, d.hair);
    }
    p(x-Math.floor(r*0.62), y-Math.floor(r*0.46), Math.floor(r*0.4), 3, PAL.ink);
    p(x+Math.floor(r*0.22), y-Math.floor(r*0.46), Math.floor(r*0.4), 3, PAL.ink);
    const ew = Math.floor(r*0.34), eh = Math.floor(r*0.30);
    const ey = y - Math.floor(r*0.26);
    for (const ex of [x-Math.floor(r*0.52), x+Math.floor(r*0.18)]) {
      p(ex-1, ey-1, ew+2, eh+2, PAL.ink);
      p(ex, ey, ew, eh, PAL.white);
      p(ex+1, ey+1, 2, 1, "#E05A5A");
      p(ex+ew-3, ey+eh-2, 2, 1, "#E05A5A");
      p(ex+Math.floor(ew/2), ey+Math.floor(eh/2), 2, 2, PAL.ink);
    }
    const my = y + Math.floor(r*0.42), mr = Math.floor(r*0.5);
    disc(x, my, mr+1, PAL.ink);
    disc(x, my, mr, "#7A1F1F");
    for (let dy = 0; dy <= mr; dy++) {
      const w = Math.floor(Math.sqrt(mr*mr - dy*dy));
      p(x-w, my+dy, 2*w+1, 1, "#3F0808");
    }
    p(x-Math.floor(mr*0.7), my-Math.floor(mr*0.55), Math.floor(mr*1.4), 3, PAL.white);
    p(x-1, my+1, 3, 4, "#C4372E");
    const sj = reduceMotion ? 0 : (Math.floor(t*8) % 2);
    p(x-r+2, y-Math.floor(r*0.1)+sj, 2, 4, "#9FE0F2");
    p(x+r-4, y+Math.floor(r*0.05)-sj, 2, 4, "#9FE0F2");
  }
  function drawScene() {
    const t = performance.now() / 1000;
    // sky + sun
    p(0, 0, W, 31, PAL.sky);
    disc(16, 11, 7, PAL.sunEdge); disc(16, 11, 6, PAL.sun);
    const rl = (Math.floor(t*2) % 2 === 0) ? 4 : 2;
    p(16-9-rl, 11, rl, 1, PAL.sunEdge); p(16+10, 11, rl, 1, PAL.sunEdge);
    p(7, 3, 2, 2, PAL.sunEdge); p(24, 3, 2, 2, PAL.sunEdge);
    // clouds
    const cx1 = W - ((t*2.2) % (W+40)) - 20;
    cloudPx(cx1, 5); cloudPx(((cx1+84) % (W+40)) - 20, 15);
    // sea bands
    p(0, 31, W, 9, PAL.seaDeep);
    p(0, 40, W, 9, PAL.sea);
    p(0, 49, W, 7, PAL.seaLite);
    p(0, 56, W, 7, PAL.shallows);
    // wave crests rolling toward shore
    for (let k = 0; k < 3; k++) {
      const yy = 33 + ((t*5 + k*8.6) % 26);
      const off = (k*5 + Math.floor(t*10)) % 14;
      for (let x = -14 + off; x < W; x += 14) p(x, yy, 6, 1, "rgba(253,253,246,.8)");
    }
    // foam edge + wet sand + dry sand
    const tide = Math.sin(t*0.9) * 2;
    for (let x = 0; x < W; x++) {
      const ys = 64 + Math.round(Math.sin(x*0.45 + t*2)*1.5 + tide);
      p(x, ys, 1, 1, PAL.foam);
      p(x, ys+1, 1, 2, PAL.wetSand);
      p(x, ys+3, 1, H-ys-3, PAL.sand);
    }
    for (const s of SPECKS) p(s[0], s[1], 1, 1, s[2] ? PAL.sandDk : PAL.sandLt);
    // shells + starfish
    p(14, 192, 2, 2, PAL.white); p(13, 193, 1, 1, "#E8C8D4");
    p(60, 212, 2, 1, "#F2C4CE"); p(61, 211, 1, 1, PAL.white);
    p(106, 180, 1, 3, "#E0784C"); p(105, 181, 3, 1, "#E0784C");
    p(104, 183, 1, 1, "#E0784C"); p(108, 183, 1, 1, "#E0784C");
    // umbrella + its shade
    p(86, 122, 24, 2, PAL.sandDk); p(90, 124, 16, 1, PAL.sandDk);
    umbrella(96, 79);
    // the sunbathers
    for (const d of DUDES) person(d, t);
    // jump-scare close-ups while screaming
    if (mode === "alarm") {
      bigScreamFace(44, 118, 28, DUDES[0], t);
      bigScreamFace(88, 160, 25, DUDES[1], t);
    }
  }

  // ---------- audio ----------
  let ctx = null, scream = null, vibTimer = 0;
  function audio() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}
    }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function unlockAudio() {
    const c = audio();
    const s = c.createBufferSource();
    s.buffer = c.createBuffer(1, 1, 22050);
    s.connect(c.destination); s.start(0);
  }
  function beep(freq, dur, vol) {
    const c = audio(), t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function distCurve(k) {
    const n = 256, c = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = i / (n - 1) * 2 - 1;
      c[i] = Math.tanh(k * x) / Math.tanh(k);
    }
    return c;
  }
  function makeVoice(c, f0, dest) {
    const o = c.createOscillator(); o.type = "sawtooth"; o.frequency.value = f0;
    const vib = c.createOscillator(); vib.frequency.value = 5 + Math.random() * 3;
    const vibG = c.createGain(); vibG.gain.value = f0 * 0.05;
    const jit = c.createOscillator(); jit.frequency.value = 22 + Math.random() * 8;
    const jitG = c.createGain(); jitG.gain.value = f0 * 0.02;
    vib.connect(vibG); vibG.connect(o.frequency);
    jit.connect(jitG); jitG.connect(o.frequency);
    const sh = c.createWaveShaper(); sh.curve = distCurve(25);
    const bp = c.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1400; bp.Q.value = 0.7;
    const g = c.createGain(); g.gain.value = 0.55;
    o.connect(sh); sh.connect(bp); bp.connect(g); g.connect(dest);
    o.start(); vib.start(); jit.start();
    const wail = setInterval(() => {
      const t = c.currentTime;
      const peak = f0 * (1.4 + Math.random() * 0.5);
      o.frequency.cancelScheduledValues(t);
      o.frequency.setValueAtTime(Math.max(60, o.frequency.value), t);
      o.frequency.exponentialRampToValueAtTime(peak, t + 0.18);
      o.frequency.exponentialRampToValueAtTime(f0, t + 0.55 + Math.random() * 0.2);
    }, 750 + Math.random() * 250);
    return { stops: [o, vib, jit], wail };
  }
  function startScream() {
    if (scream) return;
    const c = audio();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -18; comp.ratio.value = 14;
    const master = c.createGain(); master.gain.value = 1.0;
    comp.connect(master); master.connect(c.destination);
    const voices = [440, 900].map(f => makeVoice(c, f, comp));
    const nb = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = c.createBufferSource(); noise.buffer = nb; noise.loop = true;
    const nf = c.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 2600; nf.Q.value = 0.7;
    const ng = c.createGain(); ng.gain.value = 0.18;
    noise.connect(nf); nf.connect(ng); ng.connect(comp);
    noise.start();
    scream = { voices, noise, master };
    if (navigator.vibrate) {
      navigator.vibrate(600);
      vibTimer = setInterval(() => navigator.vibrate(600), 700);
    }
  }
  function stopScream() {
    if (!scream) return;
    const c = audio(), s = scream; scream = null;
    s.master.gain.setTargetAtTime(0.0001, c.currentTime, 0.04);
    setTimeout(() => {
      s.voices.forEach(v => { clearInterval(v.wail); v.stops.forEach(n => { try { n.stop(); } catch (e) {} }); });
      try { s.noise.stop(); } catch (e) {}
    }, 250);
    if (vibTimer) { clearInterval(vibTimer); vibTimer = 0; }
    if (navigator.vibrate) navigator.vibrate(0);
  }

  // ---------- wake lock ----------
  let wakeLock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) {}
  }
  function releaseWake() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  }

  // ---------- motion ----------
  function onMotion(e) {
    gotMotion = true;
    lastMotionTs = performance.now();
    let raw = 0;
    const a = e.accelerationIncludingGravity;
    if (a && a.x != null) {
      if (lastAccel) raw += Math.abs(a.x - lastAccel.x) + Math.abs(a.y - lastAccel.y) + Math.abs(a.z - lastAccel.z);
      lastAccel = { x: a.x, y: a.y, z: a.z };
    }
    const r = e.rotationRate;
    if (r && r.alpha != null) raw += (Math.abs(r.alpha) + Math.abs(r.beta) + Math.abs(r.gamma)) / 60;
    if (raw > motionLevel) motionLevel = raw;
  }

  // ---------- UI ----------
  function setScene(m) { els.scene.dataset.mode = m; }
  function setHud(tone, word) {
    els.hudWord.dataset.tone = tone;
    els.hudTime.dataset.tone = tone;
    els.hudWord.textContent = word;
  }
  function setBtn(state, label) {
    els.mainBtn.dataset.state = state;
    els.mainLabel.textContent = label;
    els.mainBtn.style.setProperty("--p", 0);
  }
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const d = Math.floor(s / 86400), h = Math.floor(s / 3600);
    if (d >= 1) return d + "D " + String(h % 24).padStart(2, "0") + "H";
    if (h >= 1) return h + "H " + String(Math.floor(s / 60) % 60).padStart(2, "0") + "M";
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }

  // ---------- permission help ----------
  const fsLink = $("fsLink"), copyRow = $("copyRow"), copyUrl = $("copyUrl"), copyBtn = $("copyBtn");
  function showPermHelp(res, err) {
    let framed = false;
    try { framed = window.self !== window.top; } catch (e) { framed = true; }
    const msg = $("permMsg");
    if (framed || err) {
      msg.innerHTML = "This view can't ask for motion access — that happens inside " +
        "in-app browsers (WhatsApp, Mail, the Claude app) and embedded previews. " +
        "Tap the button below — or if it does nothing, copy the link and paste it " +
        "into Safari's address bar — then tap <b>ARM</b> again there.";
      fsLink.href = location.href;
      fsLink.hidden = false;
      copyUrl.value = location.href;
      copyRow.hidden = false;
    } else {
      msg.innerHTML = "The browser is refusing without asking — usually it remembers an earlier " +
        "<b>Don't Allow</b> for this site. Fix in Safari: tap <b>aA</b> at the left of the " +
        "address bar → <b>Website Settings</b> → set <b>Motion &amp; Orientation Access</b> to " +
        "<b>Allow</b>, then tap ARM again. If that menu isn't there: iPhone Settings → Apps → " +
        "Safari → Advanced → Website Data → search this site → delete it, reload the page, arm again.";
      fsLink.hidden = true;
      copyRow.hidden = true;
    }
    msg.innerHTML += '<br><span style="opacity:.65;font-size:15px">debug: framed=' + framed +
      " · result=" + (res || "none") +
      (err ? " · error=" + (err.name || "?") + ": " + (err.message || "") : "") + "</span>";
    els.permWarn.hidden = false;
  }
  fsLink.addEventListener("click", () => {
    try { window.top.location.href = location.href; } catch (e) {}
  });
  copyBtn.addEventListener("click", async () => {
    copyUrl.select(); copyUrl.setSelectionRange(0, 99999);
    let ok = false;
    try { await navigator.clipboard.writeText(copyUrl.value); ok = true; } catch (e) {}
    if (!ok) { try { ok = document.execCommand("copy"); } catch (e) {} }
    copyBtn.textContent = ok ? "copied!" : "select + copy by hand";
    setTimeout(() => { copyBtn.textContent = "copy"; }, 1800);
  });

  // ---------- flow ----------
  async function armFlow() {
    unlockAudio();
    els.permWarn.hidden = true;
    if (typeof DeviceMotionEvent !== "undefined" &&
        typeof DeviceMotionEvent.requestPermission === "function") {
      let res = null, err = null;
      try { res = await DeviceMotionEvent.requestPermission(); }
      catch (e) { err = e; }
      if (res !== "granted") { showPermHelp(res, err); return; }
    }
    window.addEventListener("devicemotion", onMotion);
    keepAwake();
    startArming();
  }

  let armingTimer = 0;
  function startArming() {
    mode = "arming"; setScene("arming");
    armingLeft = 8;
    setHud("armed", "GET READY");
    setBtn("active", "Put it down flat…");
    beep(660, 0.09, 0.2);
    els.hudTime.textContent = "00:08";
    armingTimer = setInterval(() => {
      armingLeft--;
      if (armingLeft > 0) {
        beep(660, 0.09, 0.2);
        els.hudTime.textContent = "00:0" + armingLeft;
      } else {
        clearInterval(armingTimer);
        goArmed();
      }
    }, 1000);
  }

  function goArmed() {
    mode = "armed"; setScene("armed");
    motionLevel = 0; stillSince = 0;
    armedAt = performance.now();
    armedWall = Date.now();
    beep(990, 0.35, 0.25);
    setHud("armed", "HANDS OFF");
    setBtn("active", "Hold 3s to disarm");
  }

  function trigger(reason) {
    if (mode !== "armed" && mode !== "alarm") return;
    if (mode !== "alarm") {
      mode = "alarm"; setScene("alarm");
      setHud("alarm", "AAAAH!!");
    }
    stillSince = 0;
    startScream();
  }

  function calm() {
    mode = "armed"; setScene("armed");
    stopScream();
    setHud("armed", "HANDS OFF");
    setBtn("active", "Hold 3s to disarm");
  }

  function victory() {   // little 8-bit arpeggio for surviving to the end of the trip
    [523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => beep(f, i === 3 ? 0.35 : 0.13, 0.25), i * 110));
  }

  function disarm() {
    mode = "idle"; setScene("idle");
    clearInterval(armingTimer);
    stopScream();
    window.removeEventListener("devicemotion", onMotion);
    releaseWake();
    setHud("idle", "HANDS OFF");
    setBtn("idle", "☼ Arm the villa");
  }

  // ---------- the one button: tap to arm, hold 3s to disarm ----------
  let holdRaf = 0, holdStart = 0, holding = false;
  function holdFrame() {
    const p = Math.min(1, (performance.now() - holdStart) / 3000);
    els.mainBtn.style.setProperty("--p", p);
    els.mainLabel.textContent = p >= 1 ? "DISARMED" : "Keep holding… " + Math.ceil(3 - p * 3);
    if (p >= 1) { holding = false; disarm(); return; }
    holdRaf = requestAnimationFrame(holdFrame);
  }
  els.mainBtn.addEventListener("pointerdown", e => {
    if (mode === "idle") return;               // idle uses the click below
    e.preventDefault();
    els.mainBtn.setPointerCapture(e.pointerId);
    holding = true;
    holdStart = performance.now();
    holdRaf = requestAnimationFrame(holdFrame);
  });
  function holdCancel() {
    if (!holding) return;
    holding = false;
    cancelAnimationFrame(holdRaf);
    els.mainBtn.style.setProperty("--p", 0);
    els.mainLabel.textContent = mode === "arming" ? "Put it down flat…" : "Hold 3s to disarm";
  }
  els.mainBtn.addEventListener("pointerup", holdCancel);
  els.mainBtn.addEventListener("pointercancel", holdCancel);
  els.mainBtn.addEventListener("click", () => { if (mode === "idle") armFlow(); });

  // ---------- tamper: page hidden / screen locked ----------
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      if (mode === "armed" || mode === "alarm" || mode === "arming") keepAwake();
      if (mode === "armed") trigger("screen was locked or page left");
    }
  });

  // ---------- main loop ----------
  function loop() {
    const now = performance.now();
    const left = TRIP_END - Date.now();     // the trip countdown, always on the sky
    if (mode !== "arming") els.hudTime.textContent = fmt(left);

    if (mode === "armed" || mode === "alarm") {
      if (left <= 0) { victory(); disarm(); drawScene(); requestAnimationFrame(loop); return; }

      if (mode === "armed" && now - armedAt > 1500 && motionLevel > THRESHOLD) {
        trigger("movement detected");
      }
      if (mode === "armed" && gotMotion && now - lastMotionTs > 3000) {
        trigger("screen was locked or page left");
      }
      if (mode === "alarm") {
        if (motionLevel < THRESHOLD * 0.6) {
          if (!stillSince) stillSince = now;
          else if (now - stillSince > 2500) calm();
        } else stillSince = 0;
      }
    }
    motionLevel *= 0.93;
    drawScene();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
